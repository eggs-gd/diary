<!doctype html>
<html lang="en">
	<head>
		<!-- Google tag (gtag.js) -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-W7F2PWQ270"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag() {
				dataLayer.push(arguments);
			}
			// Consent policy for analytics: one switch per site.
			// 'granted' = no banner, Google Analytics cookies on (the current behaviour).
			// 'denied'  = Consent Mode: nothing is stored until a banner calls setAnalyticsConsent('granted').
			var ANALYTICS_CONSENT = 'denied';
			gtag('consent', 'default', {
				analytics_storage: ANALYTICS_CONSENT,
				ad_storage: 'denied',
				ad_user_data: 'denied',
				ad_personalization: 'denied',
				wait_for_update: 500
			});
			window.setAnalyticsConsent = function (choice) {
				try {
					localStorage.setItem('analyticsConsent', choice);
				} catch (e) {}
				gtag('consent', 'update', { analytics_storage: choice });
			};
			try {
				// A returning visitor's choice must be in place before the first page view.
				if (
					ANALYTICS_CONSENT === 'denied' &&
					localStorage.getItem('analyticsConsent') === 'granted'
				) {
					gtag('consent', 'update', { analytics_storage: 'granted' });
				}
			} catch (e) {}
			gtag('js', new Date());
			gtag('config', 'G-W7F2PWQ270');

			// Any element with data-cta="…" reports a cta_click event.
			document.addEventListener('click', function (e) {
				var el = e.target instanceof Element && e.target.closest('[data-cta]');
				if (!el) return;
				var params = {
					cta_target: el.getAttribute('data-cta'),
					cta_placement: el.getAttribute('data-cta-placement') || '',
					transport_type: 'beacon'
				};
				// Same-tab navigation would discard an event gtag.js has not sent yet, so hold the
				// click until the event is dispatched (bounded by a short timeout, e.g. blocked scripts).
				var href = el.getAttribute('href');
				var sameTab =
					href &&
					!el.hasAttribute('download') &&
					(!el.target || el.target === '_self') &&
					!(e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button);
				if (!sameTab) {
					gtag('event', 'cta_click', params);
					return;
				}
				e.preventDefault();
				var done = false;
				var go = function () {
					if (done) return;
					done = true;
					window.location.href = el.href;
				};
				params.event_callback = go;
				gtag('event', 'cta_click', params);
				setTimeout(go, 400);
			});
		</script>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0e0d0b" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
