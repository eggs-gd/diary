<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
	<defs>
		<radialGradient id="surface" cx="50%" cy="46%" r="70%">
			<stop offset="0" stop-color="#15171a" />
			<stop offset="0.62" stop-color="#101216" />
			<stop offset="1" stop-color="#090a0d" />
		</radialGradient>
		<radialGradient id="sun" cx="44%" cy="38%" r="68%">
			<stop offset="0" stop-color="#ffe16a" />
			<stop offset="0.45" stop-color="#ffc21f" />
			<stop offset="1" stop-color="#ee9700" />
		</radialGradient>
		<radialGradient id="blue" cx="37%" cy="29%" r="70%">
			<stop offset="0" stop-color="#8dc6f4" />
			<stop offset="1" stop-color="#3f88c5" />
		</radialGradient>
		<radialGradient id="green" cx="38%" cy="28%" r="70%">
			<stop offset="0" stop-color="#bfd1af" />
			<stop offset="1" stop-color="#83a175" />
		</radialGradient>
		<radialGradient id="orange" cx="35%" cy="28%" r="72%">
			<stop offset="0" stop-color="#f08a62" />
			<stop offset="1" stop-color="#c85f3d" />
		</radialGradient>
		<radialGradient id="purple" cx="38%" cy="28%" r="72%">
			<stop offset="0" stop-color="#b782cc" />
			<stop offset="1" stop-color="#8757a1" />
		</radialGradient>
		<radialGradient id="rose" cx="38%" cy="28%" r="72%">
			<stop offset="0" stop-color="#d27494" />
			<stop offset="1" stop-color="#ad4e6c" />
		</radialGradient>
		<radialGradient id="teal" cx="38%" cy="28%" r="72%">
			<stop offset="0" stop-color="#76c9c0" />
			<stop offset="1" stop-color="#4ba39a" />
		</radialGradient>
		<filter id="soft-shadow" x="-35%" y="-35%" width="170%" height="170%">
			<feDropShadow dx="0" dy="8" stdDeviation="13" flood-color="#000000" flood-opacity="0.45" />
		</filter>
		<filter id="gold-glow" x="-80%" y="-80%" width="260%" height="260%">
			<feGaussianBlur stdDeviation="13" result="blur" />
			<feColorMatrix
				in="blur"
				type="matrix"
				values="1 0 0 0 0.96  0 0.62 0 0 0.42  0 0 0.12 0 0  0 0 0 0.75 0"
				result="glow"
			/>
			<feMerge>
				<feMergeNode in="glow" />
				<feMergeNode in="SourceGraphic" />
			</feMerge>
		</filter>
		<linearGradient id="ring" x1="536" y1="396" x2="926" y2="786">
			<stop offset="0" stop-color="#9a6818" stop-opacity="0.62" />
			<stop offset="0.52" stop-color="#f3ad1a" stop-opacity="0.9" />
			<stop offset="1" stop-color="#8a6119" stop-opacity="0.58" />
		</linearGradient>
	</defs>

	<rect width="1024" height="1024" fill="#000000" />
	<rect width="1024" height="1024" rx="210" fill="url(#surface)" />

	<g filter="url(#soft-shadow)">
		<circle cx="236" cy="238" r="36" fill="url(#orange)" />
		<circle cx="744" cy="260" r="35" fill="url(#green)" />
		<circle cx="276" cy="724" r="34" fill="url(#purple)" />
		<circle cx="782" cy="782" r="36" fill="url(#teal)" />
	</g>

	<g filter="url(#gold-glow)">
		<circle cx="560" cy="535" r="70" fill="url(#sun)" />
		<circle cx="560" cy="535" r="160" fill="none" stroke="url(#ring)" stroke-width="8" />
		<circle cx="560" cy="535" r="248" fill="none" stroke="url(#ring)" stroke-width="7" opacity="0.62" />
	</g>
</svg>
